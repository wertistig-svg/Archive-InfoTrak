<VirtualHost *:${PORT}>
    ServerName _default_
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride None
        Options FollowSymLinks
        Require all granted
        FallbackResource /index.php
    </Directory>
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Ne pas conserver les codes de retour OAuth dans les journaux d'accès.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" infotrak
    CustomLog ${APACHE_LOG_DIR}/access.log infotrak
</VirtualHost>
